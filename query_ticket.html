<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单进展查询</title>
    <script src="js/jquery-3.6.4.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #1f2d3d;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #303133;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #606266;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #409eff;
        }
        .form-control.error {
            border-color: #f56c6c;
        }
        .code-group {
            display: flex;
            gap: 10px;
        }
        .code-group .form-control {
            flex: 1;
        }
        .btn-code {
            padding: 10px 16px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-code:disabled {
            background-color: #c0c4cc;
            cursor: not-allowed;
        }
        .btn-query {
            width: 100%;
            padding: 12px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-query:hover {
            background-color: #66b1ff;
        }
        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .success-message {
            color: #67c23a;
        }
        .error-message {
            color: #f56c6c;
        }
        .tip {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }
        .tickets-result {
            margin-top: 30px;
            display: none;
        }
        .tickets-result.show {
            display: block;
        }
        .ticket-item {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #409eff;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .ticket-title {
            font-size: 16px;
            font-weight: 500;
            color: #303133;
        }
        .ticket-no {
            font-size: 12px;
            color: #909399;
        }
        .ticket-info {
            margin-bottom: 15px;
        }
        .info-row {
            display: flex;
            margin-bottom: 8px;
        }
        .info-label {
            width: 80px;
            color: #606266;
            font-size: 13px;
        }
        .info-value {
            flex: 1;
            font-size: 13px;
            color: #303133;
        }
        .status-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: 500;
        }
        .status-0 { background-color: #909399; }
        .status-1 { background-color: #e6a23c; }
        .status-2 { background-color: #67c23a; }
        .status-3 { background-color: #409eff; }
        
        .replies-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }
        .replies-title {
            font-size: 14px;
            color: #606266;
            margin-bottom: 10px;
        }
        .reply-item {
            padding: 10px;
            background-color: #fff;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .reply-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .reply-author {
            font-size: 13px;
            font-weight: 500;
            color: #303133;
        }
        .reply-time {
            font-size: 12px;
            color: #909399;
        }
        .reply-content {
            font-size: 13px;
            color: #606266;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .reply-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .attachment-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
        }
        .attachment-file {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
            color: #606266;
            text-decoration: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(64, 158, 255, 0.3);
            border-radius: 50%;
            border-top-color: #409eff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 图片预览模态框 */
        .image-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .image-preview-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        .preview-image {
            max-width: 100%;
            max-height: 100%;
        }
        .close-preview {
            position: absolute;
            top: -30px;
            right: 0;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>工单进展查询</h2>
        
        <form id="queryForm">
            <div class="form-group">
                <label for="phone">手机号码 <span style="color: #f56c6c;">*</span></label>
                <div class="code-group">
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="请输入手机号码" required>
                    <button type="button" id="sendCodeBtn" class="btn-code">发送验证码</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="verifyCode">验证码 <span style="color: #f56c6c;">*</span></label>
                <input type="text" id="verifyCode" name="verifyCode" class="form-control" placeholder="请输入验证码" required>
            </div>
            
            <button type="submit" class="btn-query">查询工单</button>
            
            <div id="queryMessage" class="message"></div>
        </form>
        
        <div class="tickets-result" id="ticketsResult">
            <h3 style="margin-bottom: 20px; color: #303133;">工单列表</h3>
            <div id="ticketsList"></div>
        </div>
    </div>
    
    <!-- 图片预览模态框 -->
    <div class="image-preview" id="imagePreview">
        <div class="image-preview-content">
            <span class="close-preview" onclick="closePreview()">&times;</span>
            <img src="" alt="预览图片" class="preview-image" id="previewImage">
        </div>
    </div>

    <script>
        $(function() {
            // 发送验证码
            let countdown = 0;
            let timer = null;
            
            function updateCodeButton() {
                if (countdown > 0) {
                    $('#sendCodeBtn').prop('disabled', true);
                    $('#sendCodeBtn').text(`${countdown}秒后重发`);
                    countdown--;
                } else {
                    $('#sendCodeBtn').prop('disabled', false);
                    $('#sendCodeBtn').text('发送验证码');
                    if (timer) {
                        clearInterval(timer);
                        timer = null;
                    }
                }
            }
            
            $('#sendCodeBtn').click(function() {
                const phone = $('#phone').val().trim();
                
                if (!phone) {
                    $('#phone').addClass('error');
                    return;
                }
                
                const phoneRegex = /^1[3-9]\d{9}$/;
                if (!phoneRegex.test(phone)) {
                    alert('请输入正确的手机号码');
                    $('#phone').addClass('error');
                    return;
                }
                
                $('#phone').removeClass('error');
                
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                console.log('验证码：' + code);
                alert('验证码已发送至您的手机，验证码为：' + code + '（演示环境）');
                
                countdown = 60;
                updateCodeButton();
                timer = setInterval(updateCodeButton, 1000);
            });
            
            // 提交查询
            $('#queryForm').submit(function(e) {
                e.preventDefault();
                
                const phone = $('#phone').val().trim();
                const verifyCode = $('#verifyCode').val().trim();
                
                if (!phone || !verifyCode) {
                    alert('请填写所有必填字段');
                    return;
                }
                
                const phoneRegex = /^1[3-9]\d{9}$/;
                if (!phoneRegex.test(phone)) {
                    alert('请输入正确的手机号码');
                    return;
                }
                
                if (!/^\d{6}$/.test(verifyCode)) {
                    alert('请输入6位数字验证码');
                    return;
                }
                
                $('#queryMessage').html('<div class="loading" style="margin:0 auto;"></div>');
                
                $.ajax({
                    url: 'query_ticket.php',
                    type: 'POST',
                    dataType: 'json',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        phone: phone,
                        verify_code: verifyCode
                    }),
                    success: function(res) {
                        if (res.success) {
                            $('#queryMessage').html('<span class="success-message">查询成功</span>');
                            renderTickets(res.data);
                        } else {
                            $('#queryMessage').html('<span class="error-message">' + (res.message || '查询失败') + '</span>');
                            $('#ticketsResult').removeClass('show');
                        }
                    },
                    error: function() {
                        $('#queryMessage').html('<span class="error-message">网络错误，请稍后重试</span>');
                        $('#ticketsResult').removeClass('show');
                    }
                });
            });
            
            $('.form-control').focus(function() {
                $(this).removeClass('error');
            });
        });
        
        // 渲染工单列表
        function renderTickets(data) {
            const tickets = data.tickets || [];
            const replies = data.replies || [];
            const attachments = data.attachments || [];
            
            if (tickets.length === 0) {
                $('#ticketsList').html('<div style="text-align:center; color:#999; padding:20px;">未找到相关工单</div>');
                $('#ticketsResult').addClass('show');
                return;
            }
            
            // 按工单ID分组回复和附件
            const repliesByTicket = {};
            replies.forEach(reply => {
                if (!repliesByTicket[reply.ticket_id]) {
                    repliesByTicket[reply.ticket_id] = [];
                }
                repliesByTicket[reply.ticket_id].push(reply);
            });
            
            const attachmentsByReply = {};
            attachments.forEach(attach => {
                if (attach.reply_id) {
                    if (!attachmentsByReply[attach.reply_id]) {
                        attachmentsByReply[attach.reply_id] = [];
                    }
                    attachmentsByReply[attach.reply_id].push(attach);
                }
            });
            
            let html = '';
            tickets.forEach(ticket => {
                const statusMap = {0: '待分派', 1: '处理中', 2: '已完结', 3: '已转派'};
                const statusText = statusMap[ticket.status] || '未知状态';
                const ticketReplies = repliesByTicket[ticket.id] || [];
                
                html += `
                    <div class="ticket-item">
                        <div class="ticket-header">
                            <span class="ticket-title">${ticket.title || '无标题'}</span>
                            <span class="ticket-no">${ticket.ticket_no || ''}</span>
                        </div>
                        <div class="ticket-info">
                            <div class="info-row">
                                <span class="info-label">状态：</span>
                                <span class="info-value"><span class="status-tag status-${ticket.status}">${statusText}</span></span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">提交时间：</span>
                                <span class="info-value">${formatTime(ticket.create_time) || '未知'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">处理人：</span>
                                <span class="info-value">${ticket.handler_name || '未分配'}</span>
                            </div>
                            ${ticket.remark ? `
                            <div class="info-row">
                                <span class="info-label">处理结果：</span>
                                <span class="info-value">${ticket.remark}</span>
                            </div>
                            ` : ''}
                        </div>
                        ${ticketReplies.length > 0 ? `
                        <div class="replies-section">
                            <div class="replies-title">处理记录 (${ticketReplies.length}条)</div>
                            ${ticketReplies.map(reply => {
                                const replyAttachments = attachmentsByReply[reply.id] || [];
                                return `
                                <div class="reply-item">
                                    <div class="reply-header">
                                        <span class="reply-author">${reply.user_name || '系统'}</span>
                                        <span class="reply-time">${formatTime(reply.create_time) || '未知时间'}</span>
                                    </div>
                                    <div class="reply-content">${reply.content ? reply.content.replace(/\n/g, '<br>') : '无内容'}</div>
                                    ${replyAttachments.length > 0 ? `
                                    <div class="reply-attachments">
                                        ${replyAttachments.map(attach => {
                                            const isImage = attach.file_type && attach.file_type.startsWith('image/');
                                            if (isImage) {
                                                return `<img src="get_attachment.php?id=${attach.id}" alt="${attach.file_name}" class="attachment-thumb" onclick="previewImage('get_attachment.php?id=${attach.id}')">`;
                                            } else {
                                                return `<a href="get_attachment.php?id=${attach.id}" class="attachment-file" target="_blank">${attach.file_name}</a>`;
                                            }
                                        }).join('')}
                                    </div>
                                    ` : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            
            $('#ticketsList').html(html);
            $('#ticketsResult').addClass('show');
        }
        
        // 图片预览
        function previewImage(url) {
            $('#previewImage').attr('src', url);
            $('#imagePreview').css('display', 'flex');
        }
        
        function closePreview() {
            $('#imagePreview').css('display', 'none');
        }
        
        // 点击预览框外部关闭
        $('#imagePreview').click(function(e) {
            if (e.target === this) {
                closePreview();
            }
        });
        
        // 时间格式化
        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }
    </script>
</body>
</html>
